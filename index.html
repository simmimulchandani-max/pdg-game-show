<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The PDG Game Show</title><style>
:root{--olive:#59691c;--dark:#273510;--pear:#c8d269;--cream:#fff9e9;--line:#c6c58b;--gold:#d2a83f}*{box-sizing:border-box}body{margin:0;color:var(--dark);background:radial-gradient(ellipse at 0 0,#e3e5a3 0,transparent 25%),radial-gradient(ellipse at 100% 100%,#dce19b 0,transparent 24%),var(--cream);font-family:Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:13px 19px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--olive);color:white}.secondary{background:#e8e9b8;color:var(--dark)}.outline{background:transparent;border:1.5px solid var(--olive);color:var(--dark)}.danger{background:#f5ded5;color:#7d3120}.shell{max-width:1450px;margin:auto;padding:20px 24px 60px}header{text-align:center;margin:5px 0 27px}.pear{font-size:53px;line-height:1}h1{font-family:Georgia,serif;font-size:clamp(32px,4vw,58px);font-weight:400;letter-spacing:.035em;margin:5px 0}header p{letter-spacing:.3em;text-transform:uppercase;font-size:13px;margin:0;color:var(--olive)}.panel{border:1.5px solid var(--line);border-radius:22px;background:#fff9ebd9;padding:23px;box-shadow:0 8px 22px #4c5b1a0b}.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 245px;gap:20px;align-items:start}.panel h2{font-size:16px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 18px}.score{display:flex;justify-content:space-between;padding:14px 8px;border-bottom:1px solid #e5e0bc}.score:first-of-type{background:#e9ebad;border-radius:12px}.score b{font-size:19px}.game{text-align:center;padding:27px 35px}.gameTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:17px;letter-spacing:.09em}.timer{border:1px solid var(--olive);padding:9px 16px;border-radius:25px;letter-spacing:0;font-weight:bold}.photo{width:100%;max-width:640px;height:clamp(240px,34vw,390px);object-fit:contain;background:#eef0ce;border-radius:20px;border:1px solid #dad6a9}.placeholder{display:flex;align-items:center;justify-content:center;font-size:110px}.question{font:italic clamp(36px,5vw,68px) Georgia,serif;margin:14px 0 22px}.reveal{font:clamp(29px,4vw,49px) Georgia,serif;color:var(--olive);margin:18px}.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btnrow button{min-width:150px}.stack{display:grid;gap:12px}.hidden{display:none!important}.formrow{display:flex;gap:8px;margin:12px 0}.formrow input{flex:1;min-width:0}input,select{border:1px solid #b5ba8d;border-radius:10px;padding:12px;background:#fffef6;color:var(--dark);width:100%}.item{padding:12px;background:#f0efd3;border-radius:12px;margin:10px 0}.item small{display:block;color:#67714d}.item button{padding:7px 10px;margin-top:6px}.setup{max-width:850px;margin:auto}.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.help{color:#68734a;font-size:14px;line-height:1.5}.topbar{display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px}.awardRow{display:flex;gap:7px;margin:9px 0}.awardRow button{padding:9px 12px}.end{text-align:center;max-width:700px;margin:auto}.end h2{font:50px Georgia,serif}.muted{color:#667047}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:auto}.controls button{width:100%}.confetti{font-size:55px}.fileLabel{display:block;margin:12px 0 5px;font-weight:700}@media(max-width:1050px){.layout{grid-template-columns:1fr 1fr}.game{grid-column:1/-1;grid-row:1}.panel{min-width:0}}@media(max-width:650px){.layout,.setupGrid{grid-template-columns:1fr}.game{padding:20px 12px}.shell{padding:14px}.gameTop{font-size:12px}.photo{height:270px}.panel{padding:17px}header p{letter-spacing:.14em}}
</style></head><body><div class="shell"><header><div class="pear" aria-label="Pear logo">🍐</div><h1>THE PDG GAME SHOW</h1><p>The Family Reveal</p></header><div class="topbar"><button class="outline" id="setupBtn">⚙ Game Setup</button><button class="outline" id="fullscreenBtn">⛶ Full Screen</button></div><main id="app"></main></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://czjmgiycevkrtadlgljk.supabase.co','sb_publishable_XL2q-NdMm65ycnGsfLnsrw_XYAs710d');
const BUCKET='family-photos',KEY='pdg-local-game-v2';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const local=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
let players=Array.isArray(local.players)?local.players:['Player 1','Player 2'];
let scores=local.scores||{},roundIndex=local.roundIndex||0,revealed=false,mode='setup',timerEnabled=!!local.timerEnabled,timerSeconds=local.timerSeconds||30,timeLeft=timerSeconds,running=false,interval=null;
let rounds=[],signed={},user=null,admin=false,busy=false;
function save(){localStorage.setItem(KEY,JSON.stringify({players,scores,roundIndex,timerEnabled,timerSeconds}))}
function stopTimer(){clearInterval(interval);running=false}
function clock(){return '00:'+String(timeLeft).padStart(2,'0')}
function tick(){if(!running)return;timeLeft=Math.max(0,timeLeft-1);if(!timeLeft)stopTimer();const el=document.getElementById('clock');if(el)el.textContent='⏱ '+clock()}
function resetRound(){stopTimer();revealed=false;timeLeft=timerSeconds}
function error(e){alert(e?.message||String(e))}
function btn(label,fn,cls='secondary'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function html(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function add(parent,...children){parent.append(...children);return parent}
function notice(text){app.replaceChildren(add(html('section','panel setup'),html('p','help',text)))}
async function refresh(){const {data,error:e}=await supabase.from('family_members').select('id,name,photo_path,created_at').order('created_at',{ascending:true});if(e)throw e;rounds=data||[];signed={};for(const r of rounds){if(r.photo_path){const {data:d,error:se}=await supabase.storage.from(BUCKET).createSignedUrl(r.photo_path,3600);if(!se&&d?.signedUrl)signed[r.id]=d.signedUrl}}roundIndex=Math.min(roundIndex,Math.max(0,rounds.length-1));render()}
async function checkAdmin(){const {data,error:e}=await supabase.from('game_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(e)throw e;admin=!!data}
async function init(){const {data}=await supabase.auth.getUser();user=data.user;if(user){try{await checkAdmin();if(admin)await refresh()}catch(e){error(e)}}render()}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error:e}=await supabase.auth.signInWithPassword({email,password});if(e)return error(e);await init()}
async function logout(){stopTimer();await supabase.auth.signOut();user=null;admin=false;rounds=[];signed={};mode='setup';render()}
function renderLogin(){app.innerHTML='<section class="panel setup"><h2>Host Sign In</h2><p class="help">Only approved hosts can access family photos and game setup.</p><label class="fileLabel">Email</label><input id="email" type="email" autocomplete="username"><label class="fileLabel">Password</label><input id="password" type="password" autocomplete="current-password"><div class="btnrow" style="margin-top:20px"><button id="login" class="primary">Sign In</button></div></section>';document.getElementById('login').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
function render(){if(!user)return renderLogin();if(!admin)return notice('This account is not on the approved-admin list. Ask an administrator to add this account in Supabase.');if(mode==='play')renderPlay();else if(mode==='end')renderEnd();else renderSetup()}
function renderSetup(){app.innerHTML='<section class="setup"><div class="panel"><h2>Game Setup</h2><p class="help">Photos and family names are shared securely between approved hosts. Player names and scores are stored on this browser only. Sign in on the game-day laptop and enter your players there.</p><div class="setupGrid"><div id="players"><h2>Individual Players</h2></div><div id="family"><h2>Family Photos</h2></div></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><div id="timerArea"></div><div class="btnrow" id="setupActions" style="margin-top:25px"></div></div></section>';
const pl=document.getElementById('players');players.forEach((name,i)=>{const d=html('div','item',name+' ');d.append(btn('Remove',()=>{players.splice(i,1);delete scores[name];save();render()},'danger'));pl.append(d)});const pr=html('div','formrow'),inp=html('input');inp.placeholder='Player name';pr.append(inp,btn('Add',()=>{const name=inp.value.trim();if(!name||players.includes(name))return;players.push(name);scores[name]=0;save();render()},'primary'));pl.append(pr);
const fam=document.getElementById('family');rounds.forEach((r,i)=>{const d=html('div','item');add(d,html('strong','',r.name),html('small','',r.photo_path?'Photo uploaded':'No photo yet'));const controls=html('div','btnrow');controls.style.justifyContent='start';controls.style.marginTop='7px';const file=html('input');file.type='file';file.accept='image/*';file.style.display='none';file.onchange=()=>upload(r.id,file.files[0]);const uploadButton=btn('Upload / Replace Photo',()=>file.click());const renameButton=btn('Rename',async()=>{const name=prompt('Correct name:',r.name)?.trim();if(!name)return;await action(async()=>{const {error:e}=await supabase.from('family_members').update({name}).eq('id',r.id);if(e)throw e})});const del=btn('Delete',async()=>{if(!confirm('Delete this family member and photo?'))return;await action(async()=>{const {error:e}=await supabase.from('family_members').delete().eq('id',r.id);if(e)throw e;if(r.photo_path){const {error:se}=await supabase.storage.from(BUCKET).remove([r.photo_path]);if(se)alert('Record deleted, but photo cleanup failed: '+se.message)}})},'danger');add(controls,uploadButton,renameButton,del,file);d.append(controls);fam.append(d)});
const nameInput=html('input');nameInput.placeholder='Correct name (e.g. Meena Aunty)';const photoInput=html('input');photoInput.type='file';photoInput.accept='image/*';fam.append(html('label','fileLabel','Add family member'),nameInput,html('label','fileLabel','Photo (optional)'),photoInput,html('p','help','Photos are stored in the private Supabase bucket. Recommended: JPG, PNG or WebP, under 8 MB.'));fam.append(btn('+ Add Family Member',async()=>{const name=nameInput.value.trim();if(!name)return alert('Enter a name');await action(async()=>{const {data,error:e}=await supabase.from('family_members').insert({name}).select('id').single();if(e)throw e;if(photoInput.files[0])await uploadFile(data.id,photoInput.files[0])})},'primary'));
const t=document.getElementById('timerArea');const check=html('input');check.type='checkbox';check.checked=timerEnabled;check.onchange=()=>{timerEnabled=check.checked;save();render()};const label=html('label','toggle');label.append(check,document.createTextNode('Enable countdown timer'));t.append(label);if(timerEnabled){const sel=html('select');sel.style.maxWidth='140px';[15,30,45,60].forEach(n=>{const o=html('option','',String(n));o.value=n;o.selected=n===timerSeconds;sel.append(o)});sel.onchange=()=>{timerSeconds=Number(sel.value);timeLeft=timerSeconds;save()};t.append(html('p','help','Seconds per round:'),sel)}
const actions=document.getElementById('setupActions');actions.append(btn('▶ Start New Game',()=>{if(!players.length||!rounds.length)return alert('Add a player and family member first');scores=Object.fromEntries(players.map(p=>[p,0]));roundIndex=0;resetRound();mode='play';save();render()},'primary'));if(rounds.length)actions.append(btn('Resume Game',()=>{mode='play';render()},'outline'));actions.append(btn('↻ Refresh Shared Photos',()=>action(async()=>{}),'secondary'),btn('Sign Out',logout,'outline'))}
async function uploadFile(id,file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP image');if(file.size>8*1024*1024)throw Error('Photo must be 8 MB or smaller');const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];const path=id+'/'+crypto.randomUUID()+'.'+ext;const {error:e}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(e)throw e;const old=rounds.find(r=>r.id===id)?.photo_path;const {error:dbError}=await supabase.from('family_members').update({photo_path:path}).eq('id',id);if(dbError){await supabase.storage.from(BUCKET).remove([path]);throw dbError}if(old)await supabase.storage.from(BUCKET).remove([old])}
async function upload(id,file){await action(()=>uploadFile(id,file))}
async function action(fn){if(busy)return;busy=true;try{await fn();await refresh()}catch(e){error(e)}finally{busy=false}}
function renderPlay(){const r=rounds[roundIndex];if(!r){mode='setup';return render()}const ranked=[...players].sort((a,b)=>(scores[b]||0)-(scores[a]||0));app.innerHTML='<section class="layout"><aside class="panel"><h2>Scoreboard</h2><div id="scores"></div></aside><section class="panel game"><div class="gameTop"><span id="roundNum"></span><span id="clock"></span></div><div id="portrait"></div><div id="question"></div><div class="btnrow" id="revealButtons"></div></section><aside class="panel controls"><h2>Game Controls</h2><div class="stack" id="gameControls"></div></aside></section>';
document.getElementById('roundNum').textContent='ROUND '+(roundIndex+1)+' OF '+rounds.length;const clockEl=document.getElementById('clock');clockEl.className='timer';clockEl.textContent=timerEnabled?'⏱ '+clock():'';clockEl.style.display=timerEnabled?'':'none';ranked.forEach((p,i)=>{const d=html('div','score');add(d,html('span','',(i===0?'👑 ':'')+p),html('b','',scores[p]||0));document.getElementById('scores').append(d)});const portrait=document.getElementById('portrait');if(signed[r.id]){const im=html('img','photo');im.src=signed[r.id];im.alt='Family member to identify';portrait.append(im)}else portrait.append(html('div','photo placeholder','👤'));document.getElementById('question').append(html('div',revealed?'reveal':'question',revealed?r.name:'Who is this?'));document.getElementById('revealButtons').append(btn(revealed?'Hide Name':'Reveal Name',()=>{revealed=!revealed;if(revealed)stopTimer();render()},revealed?'secondary':'primary'));
const controls=document.getElementById('gameControls');if(timerEnabled){controls.append(btn(running?'⏸ Pause Timer':'▶ Start Timer',()=>{if(running)stopTimer();else{running=true;interval=setInterval(tick,1000)}render()},'secondary'),btn('↻ Reset Timer',()=>{resetRound();render()},'outline'))}controls.append(html('strong','','Award points'));controls.append(html('p','help','Award +100 to each person who guessed correctly.'));players.forEach(p=>{const row=html('div','awardRow');const label=html('span','',p);label.style.flex='1';label.style.alignSelf='center';row.append(label,btn('+100',()=>{scores[p]=(scores[p]||0)+100;save();render()}),btn('−',()=>{scores[p]=Math.max(0,(scores[p]||0)-100);save();render()},'outline'));controls.append(row)});controls.append(btn(roundIndex===rounds.length-1?'🏆 Finish Game':'Next Round →',()=>{if(roundIndex===rounds.length-1){stopTimer();mode='end'}else{roundIndex++;resetRound()}save();render()},'primary'),btn('⚙ Edit Setup',()=>{stopTimer();mode='setup';render()},'outline'))}
function renderEnd(){const ranked=[...players].sort((a,b)=>(scores[b]||0)-(scores[a]||0));const best=scores[ranked[0]]||0;const winners=ranked.filter(p=>(scores[p]||0)===best);app.innerHTML='<section class="panel end"><div class="confetti">🏆 🍐 🎉</div><h2>Final Results</h2><div id="winner" class="reveal"></div><h2 style="font-size:24px">Leaderboard</h2><div id="finalScores"></div><div class="btnrow" id="endActions"></div></section>';document.getElementById('winner').textContent=winners.join(' & ')+' — '+best+' points';ranked.forEach((p,i)=>{const d=html('div','score');d.append(html('span','',(i+1)+'. '+p),html('b','',scores[p]||0));document.getElementById('finalScores').append(d)});document.getElementById('endActions').append(btn('Play Again',()=>{mode='setup';render()},'primary'),btn('Game Setup',()=>{mode='setup';render()},'outline'))}
document.getElementById('setupBtn').onclick=()=>{stopTimer();mode='setup';render()};document.getElementById('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};window.addEventListener('beforeunload',stopTimer);init();
</script></body></html>
