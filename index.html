<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The PDG Game Show</title><style>
:root{--olive:#59691c;--dark:#273510;--pear:#c8d269;--cream:#fff9e9;--line:#c6c58b;--gold:#d2a83f}*{box-sizing:border-box}body{margin:0;color:var(--dark);background:radial-gradient(ellipse at 0 0,#e3e5a3 0,transparent 25%),radial-gradient(ellipse at 100% 100%,#dce19b 0,transparent 24%),var(--cream);font-family:Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:13px 19px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--olive);color:white}.secondary{background:#e8e9b8;color:var(--dark)}.outline{background:transparent;border:1.5px solid var(--olive);color:var(--dark)}.danger{background:#f5ded5;color:#7d3120}.shell{max-width:1450px;margin:auto;padding:20px 24px 60px}header{text-align:center;margin:5px 0 27px}.pear{font-size:53px;line-height:1}h1{font-family:Georgia,serif;font-size:clamp(32px,4vw,58px);font-weight:400;letter-spacing:.035em;margin:5px 0}header p{letter-spacing:.3em;text-transform:uppercase;font-size:13px;margin:0;color:var(--olive)}.panel{border:1.5px solid var(--line);border-radius:22px;background:#fff9ebd9;padding:23px;box-shadow:0 8px 22px #4c5b1a0b}.layout{display:grid;grid-template-columns:245px minmax(0,1fr) 245px;gap:20px;align-items:start}.panel h2{font-size:16px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 18px}.score{display:flex;justify-content:space-between;padding:14px 8px;border-bottom:1px solid #e5e0bc}.score:first-of-type{background:#e9ebad;border-radius:12px}.score b{font-size:19px}.game{text-align:center;padding:27px 35px}.gameTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:17px;letter-spacing:.09em}.timer{border:1px solid var(--olive);padding:9px 16px;border-radius:25px;letter-spacing:0;font-weight:bold}.photo{width:100%;max-width:640px;height:clamp(240px,34vw,390px);object-fit:contain;background:#eef0ce;border-radius:20px;border:1px solid #dad6a9}.placeholder{display:flex;align-items:center;justify-content:center;font-size:110px}.question{font:italic clamp(36px,5vw,68px) Georgia,serif;margin:14px 0 22px}.reveal{font:clamp(29px,4vw,49px) Georgia,serif;color:var(--olive);margin:18px}.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btnrow button{min-width:150px}.stack{display:grid;gap:12px}.hidden{display:none!important}.formrow{display:flex;gap:8px;margin:12px 0}.formrow input{flex:1;min-width:0}input,select{border:1px solid #b5ba8d;border-radius:10px;padding:12px;background:#fffef6;color:var(--dark);width:100%}.item{padding:12px;background:#f0efd3;border-radius:12px;margin:10px 0}.item small{display:block;color:#67714d}.item button{padding:7px 10px;margin-top:6px}.setup{max-width:850px;margin:auto}.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.help{color:#68734a;font-size:14px;line-height:1.5}.topbar{display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px}.awardRow{display:flex;gap:7px;margin:9px 0}.awardRow button{padding:9px 12px}.end{text-align:center;max-width:700px;margin:auto}.end h2{font:50px Georgia,serif}.muted{color:#667047}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:auto}.controls button{width:100%}.confetti{font-size:55px}.fileLabel{display:block;margin:12px 0 5px;font-weight:700}@media(max-width:1050px){.layout{grid-template-columns:1fr 1fr}.game{grid-column:1/-1;grid-row:1}.panel{min-width:0}}@media(max-width:650px){.layout,.setupGrid{grid-template-columns:1fr}.game{padding:20px 12px}.shell{padding:14px}.gameTop{font-size:12px}.photo{height:270px}.panel{padding:17px}header p{letter-spacing:.14em}}
</style></head><body><div class="shell"><header><div class="pear" aria-label="Pear logo">🍐</div><h1>THE PDG GAME SHOW</h1><p>The Family Reveal</p></header><div class="topbar"><button class="outline" id="setupBtn">⚙ Game Setup</button><button class="outline" id="fullscreenBtn">⛶ Full Screen</button></div><main id="app"></main></div><script>
const KEY='pdg-game-show-v1';const samples=[{id:'sample1',name:'Sample Aunty',image:''},{id:'sample2',name:'Sample Uncle',image:''},{id:'sample3',name:'Sample Family Member',image:''}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=Object.assign({players:['Player 1','Player 2'],rounds:samples,scores:{},roundIndex:0,revealed:false,mode:'setup',timerEnabled:false,timerSeconds:30,timeLeft:30,running:false},state||{});let interval;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Browser storage is full. Try smaller photos, or export a backup.');return false}}function setMode(m){state.mode=m;save();render()}function stopTimer(){clearInterval(interval);state.running=false}function tick(){if(!state.running)return;state.timeLeft=Math.max(0,state.timeLeft-1);if(!state.timeLeft)stopTimer();save();const t=document.getElementById('clock');if(t)t.textContent='⏱ '+fmt(state.timeLeft)}function fmt(s){return '00:'+String(s).padStart(2,'0')}function startTimer(){stopTimer();state.running=true;interval=setInterval(tick,1000);save();render()}function resetTimer(){stopTimer();state.timeLeft=Number(state.timerSeconds);save();render()}function resetRound(){stopTimer();state.revealed=false;state.timeLeft=Number(state.timerSeconds);save()}function addPlayer(){const input=document.getElementById('newPlayer');const name=input.value.trim();if(!name)return;if(state.players.includes(name)){alert('That player already exists');return}state.players.push(name);state.scores[name]=0;save();render()}function removePlayer(i){const n=state.players[i];state.players.splice(i,1);delete state.scores[n];save();render()}function addRound(){const name=document.getElementById('newName').value.trim();const file=document.getElementById('newPhoto').files[0];if(!name){alert('Enter the family member’s name');return}const add=image=>{state.rounds.push({id:uid(),name,image});save();render()};if(!file){add('');return}if(file.size>2.5*1024*1024){alert('Choose a photo under 2.5 MB to keep browser storage manageable.');return}const reader=new FileReader();reader.onload=()=>add(reader.result);reader.readAsDataURL(file)}function removeRound(i){state.rounds.splice(i,1);if(state.roundIndex>=state.rounds.length)state.roundIndex=Math.max(0,state.rounds.length-1);resetRound();render()}function moveRound(i,d){const j=i+d;if(j<0||j>=state.rounds.length)return;[state.rounds[i],state.rounds[j]]=[state.rounds[j],state.rounds[i]];save();render()}function award(name,delta){state.scores[name]=Math.max(0,(state.scores[name]||0)+delta);save();render()}function reveal(){state.revealed=true;stopTimer();save();render()}function next(){if(state.roundIndex>=state.rounds.length-1){setMode('end');return}state.roundIndex++;resetRound();render()}function begin(){if(!state.players.length||!state.rounds.length){alert('Add at least one player and one round.');return}state.roundIndex=0;state.scores=Object.fromEntries(state.players.map(p=>[p,0]));resetRound();setMode('play')}function resume(){setMode('play')}function setup(){stopTimer();setMode('setup')}function restart(){if(!confirm('Restart game and clear all scores? Your photos and players will remain.'))return;begin()}function exportData(){const blob=new Blob([JSON.stringify({...state,running:false},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pdg-game-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!Array.isArray(obj.players)||!Array.isArray(obj.rounds))throw Error('Invalid file');state={...state,...obj,running:false,mode:'setup'};save();render()}catch{alert('Could not import this backup.')}};reader.readAsText(file)}function renderSetup(){app.innerHTML=`<section class="setup"><div class="panel"><h2>Game Setup</h2><p class="help">Add individual players and your aunty/uncle photos. You can use sample rounds until your pictures are ready. Photos and scores are saved in this browser only; use Export Backup to move your setup to another device.</p><div class="setupGrid"><div><h2>Players (${state.players.length})</h2>${state.players.map((p,i)=>`<div class="item">${esc(p)} <button class="danger" onclick="removePlayer(${i})">Remove</button></div>`).join('')}<div class="formrow"><input id="newPlayer" placeholder="Player name" aria-label="Player name"><button class="primary" onclick="addPlayer()">Add</button></div></div><div><h2>Family Photos (${state.rounds.length})</h2>${state.rounds.map((r,i)=>`<div class="item"><strong>${esc(r.name)}</strong><small>${r.image?'Photo uploaded':'Placeholder image'}</small><button class="secondary" onclick="moveRound(${i},-1)">↑</button> <button class="secondary" onclick="moveRound(${i},1)">↓</button> <button class="danger" onclick="removeRound(${i})">Remove</button></div>`).join('')}<label class="fileLabel" for="newName">Correct name</label><input id="newName" placeholder="e.g. Meena Aunty"><label class="fileLabel" for="newPhoto">Photo (optional for now)</label><input id="newPhoto" type="file" accept="image/*"><p class="help">For this version, use compressed photos under 2.5 MB each.</p><button class="primary" onclick="addRound()">+ Add Family Member</button></div></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><div class="toggle"><input id="timerEnabled" type="checkbox" ${state.timerEnabled?'checked':''} onchange="state.timerEnabled=this.checked;save();render()"><label for="timerEnabled">Enable countdown timer</label></div>${state.timerEnabled?`<p>Seconds per round: <select style="max-width:140px" onchange="state.timerSeconds=Number(this.value);state.timeLeft=state.timerSeconds;save();render()">${[15,30,45,60].map(s=>`<option ${s===Number(state.timerSeconds)?'selected':''}>${s}</option>`).join('')}</select></p>`:''}<div class="btnrow" style="margin-top:25px"><button class="primary" onclick="begin()">▶ Start New Game</button>${state.roundIndex>0||Object.values(state.scores).some(Boolean)?'<button class="outline" onclick="resume()">Resume Game</button>':''}<button class="secondary" onclick="exportData()">Export Backup</button><label class="outline" style="padding:13px 19px;border-radius:13px;cursor:pointer;font-weight:bold">Import Backup <input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div></section>`}function renderPlay(){const r=state.rounds[state.roundIndex];if(!r){setMode('setup');return}const ranked=[...state.players].sort((a,b)=>(state.scores[b]||0)-(state.scores[a]||0));app.innerHTML=`<section class="layout"><aside class="panel"><h2>Scoreboard</h2>${ranked.map((p,i)=>`<div class="score"><span>${i===0?'👑 ':''}${esc(p)}</span><b>${state.scores[p]||0}</b></div>`).join('')}</aside><section class="panel game"><div class="gameTop"><span>ROUND ${state.roundIndex+1} OF ${state.rounds.length}</span>${state.timerEnabled?`<span class="timer" id="clock">⏱ ${fmt(state.timeLeft)}</span>`:''}</div>${r.image?`<img class="photo" src="${r.image}" alt="Family member to identify">`:'<div class="photo placeholder" role="img" aria-label="Placeholder family portrait">👤</div>'}${state.revealed?`<div class="reveal">${esc(r.name)}</div>`:'<div class="question">Who is this?</div>'}<div class="btnrow">${!state.revealed?`<button class="primary" onclick="reveal()">Reveal Name</button>`:`<button class="secondary" onclick="state.revealed=false;save();render()">Hide Name</button>`}</div></section><aside class="panel controls"><h2>Game Controls</h2><div class="stack">${state.timerEnabled?`<button class="secondary" onclick="${state.running?'stopTimer();save();render()':'startTimer()'}">${state.running?'⏸ Pause Timer':'▶ Start Timer'}</button><button class="outline" onclick="resetTimer()">↻ Reset Timer</button>`:''}<div style="margin:8px 0 0"><strong>Award points</strong><p class="help">Choose +100 for anyone who guessed correctly. Use −100 to fix mistakes.</p>${state.players.map(p=>`<div class="awardRow"><span style="flex:1;align-self:center">${esc(p)}</span><button class="secondary" aria-label="Award 100 points to ${esc(p)}" onclick="award(${JSON.stringify(p).replace(/"/g,'&quot;')},100)">+100</button><button class="outline" aria-label="Remove 100 points from ${esc(p)}" onclick="award(${JSON.stringify(p).replace(/"/g,'&quot;')},-100)">−</button></div>`).join('')}</div><button class="primary" onclick="next()">${state.roundIndex===state.rounds.length-1?'🏆 Finish Game':'Next Round →'}</button><button class="outline" onclick="setup()">⚙ Edit Setup</button></div></aside></section>`}function renderEnd(){const ranked=[...state.players].sort((a,b)=>(state.scores[b]||0)-(state.scores[a]||0));const best=state.scores[ranked[0]]||0;const winners=ranked.filter(p=>(state.scores[p]||0)===best);app.innerHTML=`<section class="panel end"><div class="confetti">🏆 🍐 🎉</div><h2>${winners.length>1?'It’s a Tie!':'We Have a Winner!'}</h2><div class="reveal">${winners.map(esc).join(' & ')}</div><p>${best} points</p><h2 style="font-size:24px">Final Leaderboard</h2>${ranked.map((p,i)=>`<div class="score"><span>${i+1}. ${esc(p)}</span><b>${state.scores[p]||0}</b></div>`).join('')}<div class="btnrow" style="margin-top:24px"><button class="primary" onclick="restart()">Play Again</button><button class="outline" onclick="setup()">Game Setup</button></div></section>`}function render(){if(state.mode==='play')renderPlay();else if(state.mode==='end')renderEnd();else renderSetup()}document.getElementById('setupBtn').onclick=setup;document.getElementById('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};window.addEventListener('beforeunload',stopTimer);state.running=false;render();
</script></body></html>
